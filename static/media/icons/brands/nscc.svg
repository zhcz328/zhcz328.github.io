<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="National Supercomputing Center">
  <defs>
    <linearGradient id="nscc-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e6de8"/>
      <stop offset="0.55" stop-color="#08bfe3"/>
      <stop offset="1" stop-color="#45e59e"/>
    </linearGradient>
    <linearGradient id="nscc-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20d5e8"/>
      <stop offset="1" stop-color="#45e59e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#04142a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="22" fill="#fff"/>
  <g filter="url(#soft-shadow)" stroke="#c9eaff" stroke-opacity="0.7" stroke-width="1.2">
    <rect x="38" y="24" width="28" height="13" rx="5" fill="url(#nscc-blue)"/>
    <rect x="92" y="24" width="28" height="13" rx="5" fill="url(#nscc-cyan)"/>

    <rect x="10" y="47" width="28" height="13" rx="5" fill="url(#nscc-blue)"/>
    <rect x="38" y="47" width="28" height="13" rx="5" fill="url(#nscc-blue)"/>
    <rect x="66" y="47" width="28" height="13" rx="5" fill="url(#nscc-cyan)"/>

    <rect x="10" y="63" width="28" height="13" rx="5" fill="url(#nscc-blue)"/>
    <rect x="66" y="63" width="28" height="13" rx="5" fill="url(#nscc-blue)"/>
    <rect x="92" y="63" width="28" height="13" rx="5" fill="url(#nscc-cyan)"/>

    <rect x="10" y="79" width="28" height="13" rx="5" fill="url(#nscc-blue)"/>
    <rect x="38" y="79" width="28" height="13" rx="5" fill="url(#nscc-cyan)"/>
    <rect x="92" y="79" width="28" height="13" rx="5" fill="url(#nscc-cyan)"/>

    <rect x="38" y="95" width="28" height="13" rx="5" fill="url(#nscc-cyan)"/>
    <rect x="66" y="95" width="28" height="13" rx="5" fill="url(#nscc-cyan)"/>
  </g>
</svg>
